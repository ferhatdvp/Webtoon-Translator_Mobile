# Bu dosya yalnızca bir GitHub deposuna yüklerseniz işe yarar: APK'yı sizin yerinize derler.
name: Build APK
on:
  workflow_dispatch: {}
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: webtoon-cevirmen-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Add APK to repository
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/webtoon-cevirmen-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/webtoon-cevirmen-debug.apk
          git commit -m "Add built APK [skip ci]"
          git push origin HEAD:main

